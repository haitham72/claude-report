<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Report social preview</title>
<!-- 1280x640 card for the GitHub social preview. Screenshots come from media/screenshots (invented data).
     Render: serve the repository root, open this file at 1280x640 and screenshot the page into media/screenshots/social-preview.png. -->
<style>
  :root { --bg: #1c1c1e; --ink: #f5f5f7; --mute: #a1a1a6; --line: #3a3a3c; --blue: #4f8cff; --green: #30d158; --amber: #ff9f0a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); }
  .glow { position: absolute; inset: 0; background: radial-gradient(640px 420px at 1010px 120px, rgba(79,140,255, .20), transparent 70%); }
  .copy { position: absolute; left: 72px; top: 64px; width: 600px; }
  .mark { display: flex; align-items: center; gap: 20px; }
  .mark svg { width: 84px; height: 84px; flex: none; }
  h1 { font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -.02em; }
  .tag { margin-top: 36px; font-size: 29px; line-height: 1.34; color: var(--mute); max-width: 540px; }
  .tag b { color: var(--ink); font-weight: 600; }
  .pills { position: absolute; left: 72px; top: 392px; display: flex; flex-wrap: wrap; gap: 10px; width: 600px; }
  .pills span { font-size: 18px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); }
  .pills span i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 9px; vertical-align: 1px; }
  .note { position: absolute; left: 72px; bottom: 44px; font-size: 16px; color: var(--mute); }
  .shot { position: absolute; border-radius: 14px; border: 1px solid #48484a; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); overflow: hidden; background: #181818; }
  .shot img { display: block; width: 100%; }
  .side { left: 716px; top: 60px; width: 250px; height: 600px; }
  .page { left: 990px; top: 130px; width: 330px; height: 560px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="copy">
  <div class="mark">
    <svg viewBox="0 0 128 128" role="img" aria-label="Claude Report icon"><rect width="128" height="128" rx="24" fill="#2c2c2e"/><rect x="24" y="64" width="20" height="44" rx="6" fill="#4f8cff"/><rect x="52" y="38" width="20" height="70" rx="6" fill="#30d158"/><rect x="80" y="12" width="20" height="96" rx="6" fill="#ff9f0a"/></svg>
    <h1>Claude Report</h1>
  </div>
  <p class="tag"><b>Plan usage, token metrics</b> and monthly achievement reports for Claude Code and Codex, inside your editor.</p>
</div>
<div class="pills">
  <span><i style="background:var(--green)"></i>Reads local files</span>
  <span><i style="background:var(--blue)"></i>No telemetry</span>
  <span><i style="background:var(--amber)"></i>Cloud or local model</span>
</div>
<p class="note">Independent project. Not affiliated with Anthropic or OpenAI.</p>
<div class="shot side"><img src="/media/screenshots/metrics-dark.png" alt=""></div>
<div class="shot page"><img src="/media/screenshots/report-page-dark.png" alt=""></div>
</body>
</html>
