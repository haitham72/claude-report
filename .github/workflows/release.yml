name: Release

# Pushing a tag like v0.11.1 tests, packages and publishes that version. Ordinary pushes never publish.
# Secrets: VSCE_PAT (VS Code Marketplace) and OVSX_PAT (Open VSX). A store whose secret is missing is skipped.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    # The test suite has so far only been run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=dist/claude-report-$version.vsix" >> "$GITHUB_OUTPUT"

      - run: npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::warning::VSCE_PAT is not set, skipping the Marketplace"; exit 0; fi
          npx --yes @vscode/vsce publish --no-dependencies --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::warning::OVSX_PAT is not set, skipping Open VSX"; exit 0; fi
          npx --yes ovsx publish "${{ steps.version.outputs.vsix }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's CHANGELOG.md section.
          awk -v v="## ${{ steps.version.outputs.version }}" '{ sub(/\r$/, "") } $0 == v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" --title "Claude Report ${{ steps.version.outputs.version }}" --notes-file notes.md
