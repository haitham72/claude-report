name: Release

# Pushing a tag like v0.11.1 tests, packages and publishes that version. Ordinary pushes never publish.
# Open VSX uses trusted publishing (GitHub OIDC, no secret): register this repository and release.yml under the
# extension's Trusted Publishers on open-vsx.org. The VS Code Marketplace also uses trusted publishing: on
# marketplace.visualstudio.com/manage, publisher haitham72, Trusted Publishing, create a policy for owner haitham72,
# repository claude-report, workflow release.yml, no environment. Global Azure DevOps PATs stop working on 2026-12-01.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  test:
    # The test suite has so far only been run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=dist/claude-report-$version.vsix" >> "$GITHUB_OUTPUT"

      - run: npm run package

      - name: Publish to the VS Code Marketplace
        # --skip-duplicate: a version already uploaded through the web form does not fail the release.
        run: npx --yes @vscode/vsce@^4.1.1 publish --oidc --skip-duplicate --packagePath "${{ steps.version.outputs.vsix }}"

      - name: Publish to Open VSX
        run: npx --yes ovsx publish "${{ steps.version.outputs.vsix }}" --trusted-publishing

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's CHANGELOG.md section.
          awk -v v="## ${{ steps.version.outputs.version }}" '{ sub(/\r$/, "") } $0 == v { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.vsix }}" --title "Claude Report ${{ steps.version.outputs.version }}" --notes-file notes.md
