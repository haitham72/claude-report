<title>AI Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One quiet column: overview, usage, projects, prompting and evidence are separate sections behind a sticky nav. Project colours appear only as dots and chart series; everything else is neutral. */
:root{--bg:#f6f6f8;--card:#ffffff;--fg:#111114;--sec:#5b5b62;--line:#e3e3e8;--fill:#eeeef2;--accent:#0a5fd0;--ok:#1a7f37;--warn:#955500;--other:#8e8e96;
--c0:#2f6fed;--c1:#12a150;--c2:#e08600;--c3:#d6336c;--c4:#8a4fd6;--c5:#0f9eb0;--c6:#5a5ad6;--c7:#a07a2c;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#18181b;--fg:#f2f2f5;--sec:#a8a8b0;--line:#2c2c31;--fill:#232328;--accent:#6cb0ff;--ok:#5fd07a;--warn:#f0b24a;--other:#7d7d86;
--c0:#5b8dff;--c1:#34c274;--c2:#f0a030;--c3:#ee5a90;--c4:#b27cf0;--c5:#3cc0d2;--c6:#8484f0;--c7:#c9a24e;color-scheme:dark}}
@media screen{:root[data-theme="dark"]{--bg:#0e0e10;--card:#18181b;--fg:#f2f2f5;--sec:#a8a8b0;--line:#2c2c31;--fill:#232328;--accent:#6cb0ff;--ok:#5fd07a;--warn:#f0b24a;--other:#7d7d86;
--c0:#5b8dff;--c1:#34c274;--c2:#f0a030;--c3:#ee5a90;--c4:#b27cf0;--c5:#3cc0d2;--c6:#8484f0;--c7:#c9a24e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;padding:22px 0 14px}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--sec);font-size:13px}
.theme{display:flex;align-items:center;gap:6px;color:var(--sec);font-size:12.5px}
.theme select,#chart-project{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px}
nav.sections{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;margin:0 -16px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line)}
nav.sections a{padding:6px 12px;border-radius:999px;color:var(--sec);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
nav.sections a:hover{background:var(--fill);color:var(--fg)}
section.block{margin-top:30px;scroll-margin-top:60px}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sec)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--sec)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
.kpi{padding:12px 14px}
.kpi b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{display:block;color:var(--sec);font-size:12.5px}
.ov-row{display:grid;grid-template-columns:104px 1fr;gap:4px 16px;padding:12px 16px;border-top:1px solid var(--line)}
.ov-row:first-child{border-top:0}
.ov-row dt{color:var(--sec);font-size:12.5px;font-weight:600}
.ov-row dd{margin:0;font-size:15px}
.outcome{margin:6px 0 0;font-size:12.5px;color:var(--sec)}
.notice{padding:10px 16px;font-size:13px;border-top:1px solid var(--line)}
.notice ul{margin:4px 0 0;padding-left:18px}
@media (max-width:560px){.ov-row{grid-template-columns:1fr}}
.chartcard{position:relative;padding:12px 14px 10px}
.chartbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
#chart{width:100%;display:block}
#chart text{font-family:var(--font);font-size:10.5px;fill:var(--sec)}
#chart [data-n]{transition:opacity .12s}
#chart.hov [data-n]{opacity:.2}
#chart.hov [data-n].on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:999px;padding:2px 9px;font-size:12.5px;color:var(--sec);cursor:pointer}
.lg:hover,.lg[aria-pressed="true"]{background:var(--fill);color:var(--fg)}
.legend.hov .lg:not(.on){opacity:.45}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pc);flex:none}
.split{margin:8px 0 0;color:var(--sec);font-size:12.5px}
.tip{position:absolute;pointer-events:none;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2}
.tip[hidden]{display:none}
details.tbl{margin-top:8px;font-size:12.5px}
.scroll{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.link{color:var(--accent);font-weight:600;font-size:13px}
.expand{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:2px 4px}
.key{margin:0 0 10px;color:var(--sec);font-size:12.5px}
.rows{display:grid;gap:8px}
.proj>summary{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:12px 40px 12px 14px;position:relative}
.proj>summary::after{content:"";position:absolute;right:18px;top:20px;width:7px;height:7px;border-right:2px solid var(--sec);border-bottom:2px solid var(--sec);transform:rotate(45deg);transition:transform .15s}
.proj[open]>summary::after{transform:rotate(-135deg);top:23px}
.pname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.ptxt{display:flex;flex-direction:column;gap:1px;min-width:0}
.advgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.adv{padding:14px 16px;border-top:3px solid var(--k)}
.adv.s{--k:var(--ok)}.adv.w{--k:var(--warn)}.adv.t{--k:var(--accent)}
.advk{display:block;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--k)}
.adv p{margin:0;font-size:15px}.adv .evid{margin-top:8px;font-size:12.5px}
.advlinks{margin:10px 0 0;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.pico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,var(--card))}
.pico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pmeta{color:var(--sec);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pc);border-radius:2px}
.pone{color:var(--sec);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.proj[open] .pone{display:block;color:var(--fg)}
.pchips{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.plain{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:13px}
.pbody{padding:2px 16px 14px;border-top:1px solid var(--line)}
.pbody h4,.rev h4{margin:14px 0 4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sec)}
.pbody ul,.rev ul{margin:0;padding-left:18px}
.pbody li,.rev li{margin:2px 0}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:700;line-height:20px;white-space:nowrap}
.chip.requested{color:var(--sec)}
.chip.recorded{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.verified{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.ex{padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex h5{margin:0;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ex p{margin:4px 0 0}
.evid{color:var(--sec);font-size:12.5px;overflow-wrap:anywhere}
.lbl{font-weight:700;margin-right:4px}
.time{margin-top:6px;font-size:12.5px;color:var(--sec);display:grid;gap:3px;max-width:340px;font-variant-numeric:tabular-nums}
.time .tr{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center}
.tb{height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.tb i{display:block;height:100%;border-radius:3px}
.tb .w{background:var(--other)}
.tb .a{background:var(--pc)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 20px}
details.rest{margin-top:8px}
details.rest>summary{padding:10px 16px;text-align:center}
details.rest>.rows{margin-top:8px}
.synth{padding:14px 16px;font-size:15px}
.synth p{margin:0}
.meta{color:var(--sec);font-size:12.5px;margin:4px 0 0}
.rev>summary{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-weight:700}
.rev>summary span{font-weight:400;color:var(--sec);font-size:12.5px}
.rev .rbody{padding:0 16px 14px;border-top:1px solid var(--line)}
.rev p{margin:6px 0 0}
q{quotes:"\201C" "\201D";font-style:italic}
.ref{color:var(--sec);font-size:12px;display:block}
.tag{font-size:11.5px;color:var(--sec);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:400}
.git>summary{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-weight:700}
.git>summary span{font-weight:400;color:var(--sec);font-size:12.5px}
.git .gbody{padding:0 16px 12px;border-top:1px solid var(--line)}
.git ul{margin:6px 0;padding-left:0;list-style:none}
.git li{margin:4px 0;overflow-wrap:anywhere}
.git code,.git time{color:var(--sec);font-size:12px}
.method{padding:12px 16px;font-size:13px}
.method ul{margin:6px 0 0;padding-left:18px}
.foot{margin:28px 0 0;color:var(--sec);font-size:12px;text-align:center}
@media (max-width:560px){.proj>summary{grid-template-columns:34px minmax(0,1fr)}.pmeta{grid-column:2;white-space:normal}.pchips{grid-column:2}.git>summary,.rev>summary{flex-wrap:wrap;gap:2px 12px}nav.sections a{padding:6px 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
:root,:root[data-theme]{--bg:#fff;--card:#fff;--fg:#111;--sec:#555;--line:#ccc;--fill:#eee;--accent:#0a5fd0;--ok:#146c2e;--warn:#7a4500;--other:#8e8e96;
--c0:#2f6fed;--c1:#12a150;--c2:#e08600;--c3:#d6336c;--c4:#8a4fd6;--c5:#0f9eb0;--c6:#5a5ad6;--c7:#a07a2c;color-scheme:light}
body{background:#fff}
nav.sections,.theme,.expand,.tip,.proj>summary::after,details.rest>summary,details.tbl{display:none}
.card{break-inside:avoid;border-color:#ccc}
.proj,.rev,.git{break-inside:auto}
.proj .pone{display:block;-webkit-line-clamp:unset}
section.block{margin-top:18px}
.lg{border:0}}
</style>
<div class="wrap" id="app"></div>
<script type="application/json" id="report-data">__DATA__</script>
<script>

  var hrs = function (h) { return h < 1 ? Math.round(h * 60) + ' min' : (Math.round(h * 10) / 10) + ' h'; };
  var plural = function (n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var shortDay = function (d) { var p = d.split('-'); return +p[2] + ' ' + MONTHS[+p[1] - 1]; };

  var TOP = 8, LIMIT = 6;

    diamond: '<path d="M12 3l9 9-9 9-9-9z"/>',

    wave: '<path d="M3 12c3-6 6-6 9 0s6 6 9 0"/>',

  var ICON_NAMES = Object.keys(ICONS);
  // A project name can hint at its kind; anything else gets a stable shape from its name.
  var HINTS = [[/doc|report|writing|blog/i, 'doc'], [/api|server|backend|database|sql/i, 'database'], [/web|site|page|landing/i, 'globe'], [/mobile|ios|android|app\b/i, 'phone'], [/mail|newsletter/i, 'mail'],

      '<div class="advgrid">' + tile('s', 'Strength', a.strength) + tile('w', 'Watch', a.watch) + tile('t', 'Try', a.habit) + '</div>' +
      (links ? '<p class="advlinks"><span class="lbl">Learn more</span>' + links + '</p>' : '') + '</section>';
  }
  var reported = P.filter(function (p) { return p.report; });
  var total = P.reduce(function (s, p) { return s + (p.tokens || 0); }, 0);

  // A request, a recorded change and a verified outcome are different claims. Older reports have no status, so only the clearest wording is read as a request.

  var days = arr(D.days);
  var activeDays = days.filter(function (day) { return P.some(function (p) { return (p.daily && p.daily[day] > 0) || (p.dailyTurns && p.dailyTurns[day] > 0); }); }).length;

    mark(pinned);
  }

  // Hover, focus or a click on a legend entry lights that series and dims the rest.
  function mark(name) {
    var svg = document.getElementById('chart'), legend = document.getElementById('legend');
    if (!svg || !svg.classList) return;
    svg.classList[name ? 'add' : 'remove']('hov');
    Array.prototype.forEach.call(svg.querySelectorAll('[data-n]'), function (el) { el.classList[el.getAttribute('data-n') === name ? 'add' : 'remove']('on'); });
    if (!legend) return;
    legend.classList[name ? 'add' : 'remove']('hov');
    Array.prototype.forEach.call(legend.children, function (el) { el.classList[el.getAttribute('data-n') === name ? 'add' : 'remove']('on'); });
  }
  function wire() {
    var svg = document.getElementById('chart'), tip = document.getElementById('tip'), legend = document.getElementById('legend');
    if (!svg || !svg.addEventListener) return;
    var card = svg.parentNode;
    svg.addEventListener('mousemove', function (e) {
      var t = e.target.closest ? e.target.closest('[data-n]') : null;
      if (!t) { mark(pinned); tip.hidden = true; return; }
      mark(t.getAttribute('data-n'));
      tip.innerHTML = '<i class="dot" style="--pc:' + t.getAttribute('data-c') + '"></i> ' + esc(t.getAttribute('data-title')) + ' · ' + shortDay(t.getAttribute('data-d')) + ' · ' + human(+t.getAttribute('data-v'));
      tip.hidden = false;
      var r = card.getBoundingClientRect();
      tip.style.left = Math.max(4, Math.min(e.clientX - r.left + 10, r.width - tip.offsetWidth - 4)) + 'px';
      tip.style.top = Math.max(2, e.clientY - r.top - 34) + 'px';
    });
    svg.addEventListener('mouseleave', function () { mark(pinned); tip.hidden = true; });
    if (!legend || !legend.addEventListener) return;
    var key = function (e) { var t = e.target.closest ? e.target.closest('[data-n]') : null; return t ? t.getAttribute('data-n') : ''; };
    legend.addEventListener('mouseover', function (e) { mark(key(e) || pinned); });
    legend.addEventListener('focusin', function (e) { mark(key(e) || pinned); });
    legend.addEventListener('mouseleave', function () { mark(pinned); });
    legend.addEventListener('focusout', function () { mark(pinned); });
    legend.addEventListener('click', function (e) {
      var k = key(e);
      if (!k) return;
      pinned = pinned === k ? '' : k;
      Array.prototype.forEach.call(legend.children, function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('data-n') === pinned)); });
      mark(pinned);
    });
  }
  draw();
  wire();
  if (chartProject) chartProject.addEventListener('change', function () { pinned = ''; draw(); });
  window.addEventListener('resize', draw);
})();
</script>
