<style>
/* Claude Report sidebar. Layout, spacing and type follow Claude Control (MIT, Lucas do Nordeste): a dense HUD that takes its background and text from the VS Code theme, mono labels, thin rules. Only the colours are Claude Report's: a blue accent, and one colour per project. */
:root {
  --accent: #4f8cff;
  --accent-dim: #4f8cff33;
  --accent-soft: #4f8cff18;
  --accent-line: #4f8cff;
  --led-on: #34c759;
  --led-off: #5a5a5a;
  --warn: #ff9f0a;
  --warn-text: #ff9f0a;
  --danger: #ff453a;
  --danger-text: #ff453a;
  --info: #5e5ce6;
  --hair: color-mix(in srgb, var(--vscode-foreground) 14%, transparent);
  --hair-soft: color-mix(in srgb, var(--vscode-foreground) 8%, transparent);
  --row-hover: color-mix(in srgb, var(--vscode-foreground) 7%, transparent);
  --panel: color-mix(in srgb, var(--vscode-foreground) 4%, transparent);
  --mute: color-mix(in srgb, var(--vscode-foreground) 55%, transparent);
  --mute2: color-mix(in srgb, var(--vscode-foreground) 38%, transparent);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --c0: #0a84ff; --c1: #30d158; --c2: #ff9f0a; --c3: #ff375f; --c4: #bf5af2; --c5: #40c8e0;
  --c6: #5e5ce6; --c7: #ffd60a; --c8: #ff453a; --c9: #63e6e2; --c10: #ac8e68; --c11: #64d2ff;
}
body.vscode-light, body.vscode-high-contrast-light {
  --accent: #2563d6; --accent-dim: #2563d633; --accent-soft: #2563d618;
  --warn-text: #8a6200; --danger-text: #b3312b;
  --c0: #007aff; --c1: #34c759; --c2: #ff9500; --c3: #ff2d55; --c4: #af52de; --c5: #30b0c7;
  --c6: #5856d6; --c7: #e0a800; --c8: #ff3b30; --c9: #00a89f; --c10: #a2845e; --c11: #32ade6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--vscode-font-family); font-size: 13px; color: var(--vscode-foreground); background: transparent; overflow-x: hidden; }
#app { display: flex; flex-direction: column; min-height: 100vh; }
.boot { padding: 18px; color: var(--mute); font-family: var(--mono); font-size: 11px; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

.top { position: sticky; top: 0; z-index: 5; background: var(--vscode-sideBar-background, var(--vscode-editor-background)); border-bottom: 1px solid var(--hair); }
.hdr { display: flex; align-items: center; gap: 9px; padding: 10px 12px 7px; }
.hdr .mark { width: 20px; height: 20px; flex: 0 0 auto; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-dim)); }
.hdr .title { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hdr .title b { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 650; }
.hdr .title span { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; color: var(--mute2); }
.hdr .spacer { flex: 1; }
.iconbtn { appearance: none; border: 1px solid var(--hair); background: transparent; color: var(--mute); width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; cursor: pointer; transition: all .15s ease; }
.iconbtn:hover { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
.iconbtn:active { transform: scale(.92); }
.iconbtn svg { width: 14px; height: 14px; }
.iconbtn.spin svg { animation: spin .6s ease; }

.tabs { display: flex; gap: 4px; padding: 0 11px 8px; }
.tab { appearance: none; position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; background: transparent; border: 1px solid var(--hair); color: var(--mute); cursor: pointer; padding: 6px 7px; border-radius: 7px; flex: 0 0 auto; min-width: 30px; transition: color .14s ease, border-color .14s ease, background .14s ease; }
.tab:hover { color: var(--vscode-foreground); border-color: var(--mute2); }
.tab.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); flex: 1 1 auto; }
.tab .tic { width: 14px; height: 14px; display: grid; place-items: center; flex: 0 0 auto; }
.tab .tic svg { width: 14px; height: 14px; display: block; }
.tab .tlb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab:not(.on) .tlb { display: none; }
.tabdot { position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 5px var(--warn); animation: pulse 1.6s ease-in-out infinite; }
.tabdot.err { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
.tabdot.run { background: var(--accent); box-shadow: 0 0 5px var(--accent); }

.cp-scope { display: flex; align-items: center; gap: 7px; padding: 13px 14px 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mute2); }
.cp-scope .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent); flex: 0 0 auto; }
.cp-scope .path { margin-left: auto; font-size: 9px; letter-spacing: .06em; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; text-transform: none; }
.row { display: flex; align-items: center; gap: 9px; padding: 5px 11px 5px 14px; border-radius: 7px; margin: 0 4px; min-height: 28px; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--row-hover); }
.row .led { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--led-off); }
.row .led.on { background: var(--led-on); box-shadow: 0 0 6px var(--led-on); }
.row .led.run { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.row .led.bad { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.row .ic { width: 14px; height: 14px; color: var(--mute); flex: 0 0 auto; }
.row .body { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
.row .body .l { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .body .d { font-size: 10.5px; color: var(--mute2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .state { white-space: nowrap; font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--mute2); flex: 0 0 auto; }
.row .state.run { color: var(--accent); }
.row .state.ok { color: var(--led-on); }
.row .state.bad { color: var(--danger-text); }
.row.act { color: var(--accent); margin-top: 2px; }
.row.act .ic, .row.act .l { color: var(--accent); }
.row.act .l { font-weight: 550; }
.row.act:hover { background: var(--accent-soft); }
.row.off { opacity: .5; pointer-events: none; }
.cp-note { margin: 6px 14px 4px; font-family: var(--mono); font-size: 9.5px; line-height: 1.5; color: var(--mute2); }
.cp-lead { display: flex; align-items: center; gap: 8px; margin: 8px 11px 2px; padding: 7px 9px; border: 1px solid var(--hair); border-left: 2px solid var(--warn); border-radius: 7px; background: var(--hair-soft); font-size: 11px; color: var(--vscode-foreground); }
.cp-lead button { margin-left: auto; appearance: none; border: 1px solid var(--accent-dim); background: var(--accent-soft); color: var(--accent); font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
.cp-scope.sub { padding-top: 9px; }
.cp-links a { cursor: pointer; text-decoration: underline; text-decoration-color: var(--hair); }
.cp-links a:hover { color: var(--accent); }
.cb { width: 12px; height: 12px; border: 1px solid var(--mute); border-radius: 3px; flex: 0 0 auto; position: relative; }
.cb.on { background: var(--accent); border-color: var(--accent); }
.cb.on::after { content: ""; position: absolute; left: 3px; top: 0; width: 3px; height: 7px; border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
.cp-field { margin: 2px 14px 4px; }
.cp-in { width: 100%; appearance: none; border: 1px solid var(--hair); border-radius: 6px; background: var(--hair-soft); color: var(--vscode-foreground); font-family: var(--vscode-font-family); font-size: 12px; padding: 4px 8px; outline: none; }
.cp-in:focus { border-color: var(--accent-dim); }
.cp-links a.cur { color: var(--accent); text-decoration: none; font-weight: 600; }
.cp-cta { margin: 12px 11px 4px; }
.btn { width: 100%; appearance: none; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-family: var(--vscode-font-family); font-size: 12.5px; font-weight: 600; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: filter .12s ease; }
.btn:hover { filter: brightness(1.1); }
.btn.off { opacity: .4; pointer-events: none; }
.cp-sub { margin-top: 5px; text-align: center; font-family: var(--mono); font-size: 9.5px; color: var(--mute2); }
.seg { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; }
.seg a, .seg button { padding: 2px 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; cursor: pointer; color: var(--mute); }
.seg button { appearance: none; border: 0; background: transparent; }
.seg a.on, .seg button.on { background: var(--accent-soft); color: var(--accent); }
.metric-sources { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 11px 8px; }
.metric-sources button { background: transparent; border: 1px solid var(--hair); color: var(--mute); cursor: pointer; border-radius: 5px; padding: 3px 7px; font: 10px var(--mono); }
.metric-sources button:hover, .metric-sources button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }
.row .body .failure { color: var(--danger-text); white-space: normal; }
.report-actions { display: flex; gap: 6px; }
.cp-scope .hidden-reports { margin-left: auto; padding: 3px 7px; white-space: nowrap; }
.row.saved-report { gap: 4px; padding: 0 7px 0 0; }
.saved-report:hover { background: var(--row-hover); }
.saved-report .report-open { appearance: none; display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; padding: 5px 0 5px 14px; border: 0; background: transparent; color: var(--accent); font: inherit; text-align: left; cursor: pointer; }
.saved-report .report-open .l { font-weight: 550; }
.saved-report .report-manage { flex: 0 0 auto; padding: 0; font: 16px/1 var(--vscode-font-family); }
.cp-bar { height: 3px; margin: 2px 14px 6px; background: var(--hair); border-radius: 2px; overflow: hidden; }
.cp-bar span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.progress { margin: 10px 14px 4px; border: 1px solid var(--hair); border-radius: 7px; }
.progress-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 5px 8px; }
.progress-toggle { appearance: none; border: 0; background: transparent; color: var(--vscode-foreground); font: inherit; cursor: pointer; padding: 3px 0; text-align: left; min-width: 0; flex: 1 1 105px; }
.progress-toggle .progress-summary { display: block; color: var(--mute); font-size: 10px; margin-top: 2px; }
.progress-toggle svg { width: 11px; height: 11px; vertical-align: -1px; margin-right: 4px; }
.progress-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.progress-body { border-top: 1px solid var(--hair); padding-bottom: 4px; }
.progress-tools { display: flex; justify-content: flex-end; padding: 6px 8px; }
.progress-flow { list-style: none; margin: 0; padding: 0 8px 4px 22px; }
.progress-step { position: relative; margin: 0 0 8px; padding: 0; }
.progress-step:not(:last-child)::before { content: ""; position: absolute; left: -9px; top: 15px; height: calc(100% + 8px); border-left: 1px solid var(--hair); }
.progress-step::after { content: ""; position: absolute; top: 12px; left: -12px; width: 7px; height: 7px; border-radius: 100%; background: var(--hair); }
.progress-step.active::after { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: progress-pulse 1.4s ease-in-out infinite alternate; }
.progress-step > .row { margin: 0; border: 1px solid var(--hair); border-radius: 6px; }
.progress-branches { border-left: 1px solid var(--hair); margin: 0 0 0 9px; padding: 0 0 0 7px; }
.option-switch { display: inline-flex; align-items: center; gap: 6px; padding: 2px; border: 0; color: inherit; background: transparent; cursor: pointer; font: inherit; }
@keyframes progress-pulse { to { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .progress-step.active::after { animation: none; } }
.splash { min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 24px; text-align: center; }
.splash .logo { width: 52px; height: 52px; margin-bottom: 8px; }
.splash .b { transform-box: fill-box; transform-origin: bottom; animation: rise 1.3s ease-in-out infinite; }
.splash .b1 { fill: var(--c0); } .splash .b2 { fill: var(--c1); animation-delay: .15s; } .splash .b3 { fill: var(--c2); animation-delay: .3s; }
@keyframes rise { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
.sp-t { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 650; }
.sp-s { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--mute2); }
.sp-bar { width: 150px; height: 3px; margin-top: 14px; background: var(--hair); border-radius: 2px; overflow: hidden; }
.sp-bar span { display: block; width: 38%; height: 100%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(270%); } }
.sp-m { margin-top: 8px; font-family: var(--mono); font-size: 9.5px; color: var(--mute2); }
@media (prefers-reduced-motion: reduce) { .splash .b, .sp-bar span { animation: none; } }
.kv { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; padding: 7px 14px; }
.kv + .kv { border-top: 1px solid var(--hair-soft); }
.kv .k { font-size: 12.5px; grid-column: 1; }
.kv .sub { grid-column: 1; font-family: var(--mono); font-size: 9.5px; letter-spacing: .03em; color: var(--mute2); }
.kv .v { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-family: var(--mono); font-size: 11px; }
.kv .dim { color: var(--mute2); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--hair); color: var(--mute); }
.badge.ok { color: var(--led-on); border-color: color-mix(in srgb, var(--led-on) 45%, transparent); }
.badge i { width: 5px; height: 5px; border-radius: 50%; background: var(--led-on); }
.btns { display: flex; gap: 6px; padding: 8px 14px 4px; }
.btn.sm { width: auto; padding: 5px 12px; font-size: 11.5px; font-weight: 550; background: transparent; color: var(--vscode-foreground); border-color: var(--hair); }
.btn.sm:hover { border-color: var(--accent); color: var(--accent); filter: none; }
.btn.sm.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.sm.pri:hover { color: #fff; filter: brightness(1.1); }
.out { margin: 6px 14px; padding: 6px 9px; border-left: 2px solid var(--hair); font-family: var(--mono); font-size: 10px; line-height: 1.55; color: var(--mute); }
.out.ok { border-left-color: var(--led-on); }
.out.bad { border-left-color: var(--danger); }
.rb { width: 12px; height: 12px; border: 1px solid var(--mute); border-radius: 50%; flex: 0 0 auto; }
.rb.on { border-color: var(--accent); background: radial-gradient(var(--accent) 0 42%, transparent 48%); }
.row .state.max { color: var(--vscode-foreground); font-size: 11px; }
.cp-scope.click { cursor: pointer; }
.cp-scope .chev { width: 10px; height: 10px; flex: 0 0 auto; transition: transform .15s ease; }
.cp-scope.closed .chev { transform: rotate(-90deg); }
/*__METRICS_CSS__*/
.row .state { width: auto; min-width: 24px; }
</style>

(function () {

    if (t.dataset.opt) {
      var key = t.dataset.opt;
      var output = (S.d && S.d.export) || {};
      var value = t.dataset.value || !output[key];
      if (S.d && ['depth', 'deepEffort', 'estimateTime'].indexOf(key) >= 0) {
        S.d.export = Object.assign({}, output, { [key]: value });
        render();
      }
      post({ cmd: 'opt', key: key, value: value });
      return;
    }
    if (t.dataset.fmt) { post({ cmd: 'opt', key: 'format', value: t.dataset.fmt }); return; }
    if (t.dataset.proj) { S.sel[t.dataset.proj] = S.sel[t.dataset.proj] === false; persist(); render(); return; }
    var a = t.dataset.act;
    if (a === 'refresh') { S.spin = true; render(); post({ cmd: 'refresh' }); setTimeout(function () { S.spin = false; }, 700); }
    else if (a === 'all' || a === 'none') { ((S.d && S.d.reportProjects) || []).forEach(function (p) { S.sel[projectId(p)] = a === 'all'; }); persist(); render(); }
    else if (a === 'create') post({ cmd: 'create', projects: chosen() });
    else if (a === 'reportRange') post({ cmd: 'reportRange', mode: t.dataset.modeValue });
    else if (a === 'toggleProgress') { S.progressOpen = !S.progressOpen; render(); }
    else if (a === 'progressView') { S.progressView = t.dataset.view === 'flow' ? 'flow' : 'list'; persist(); render(); }
    else if (a === 'cancelReport' || a === 'archivedReports') post({ cmd: a });
    else if (a === 'dropChain') post({ cmd: 'dropChain' });
    else if (a === 'newSession') post({ cmd: 'newSession' });
    else if (a === 'sessOnly') { S.sessOnly = !S.sessOnly; persist(); render(); }
    else if (a === 'localScan') { pending(); post({ cmd: 'localScan' }); }
    else if (a === 'openEngine') { S.local = Object.assign({}, S.local, { checking: true }); render(); post({ cmd: 'openEngine' }); }
    else if (a === 'pickFolder') post({ cmd: 'pickFolder' });
    else if (a === 'test') { S.test = null; post({ cmd: 'test' }); }
    else if (a === 'open' || a === 'manage' || a === 'retryFailed') post(Object.assign({ cmd: a, month: t.dataset.month }, t.dataset.run ? { run: t.dataset.run } : {}));
    else if (a === 'connect') post({ cmd: 'connect' });
    else if (a === 'disconnect') post({ cmd: 'disconnect' });
  });

  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el && el.dataset && el.dataset.optInput) post({ cmd: 'opt', key: el.dataset.optInput, value: el.value });
  });

  window.addEventListener('message', function (e) {
    var m = e.data || {};
    if (m.type === 'state') { S.d = m.d; render(); }
    else if (m.type === 'local') { S.local = m.d; render(); }
    else if (m.type === 'test') { S.test = { ok: m.ok, lines: m.lines || [] }; render(); }
    else if (m.type === 'tab') { S.tab = m.tab; persist(); render(); }
    else if (m.type === 'runStart') {
      S.items = []; S.phases = []; S.result = null; S.stage = ''; S.stageText = ''; S.running = true; S.progressOpen = true;
      render();
    } else if (m.type === 'progress') {
      var it = S.items.filter(function (x) { return x.project === m.project; })[0];
      if (it) { it.status = m.status; it.error = m.error; it.detail = m.detail; }
      else S.items.push({ project: m.project, status: m.status, detail: m.detail, error: m.error });
      render();
    } else if (m.type === 'stage') {
      S.stage = m.stage; S.stageText = m.text || '';
      S.running = !!m.stage && m.stage !== 'done' && m.stage !== 'error' && m.stage !== 'cancelled';
      if (S.running) {
        if (!S.phases.some(function (phase) { return phase.kind === m.stage && phase.text === m.text; })) {
          if (!S.phases.length) S.progressOpen = true;
          S.phases.push({ kind: m.stage, text: S.stageText });
        }
      } else {
        S.result = m;
        if (m.stage === 'cancelled' || m.stage === 'error') {
          S.items.forEach(function (item) {
            if (item.status === 'working' || item.status === 'gathering' || item.status === 'queued') {
              item.status = m.stage === 'cancelled' ? 'cancelled' : 'stopped';
            }
          });
        }
        if (m.partial || m.stage === 'error') S.progressOpen = true;
        else if (m.stage === 'done' && m.run) S.progressOpen = false;
      }
      render();
    } else if (m.type === 'running') { S.running = !!m.on; render(); }
  });

  post({ cmd: 'ready' });
})();
</script>
